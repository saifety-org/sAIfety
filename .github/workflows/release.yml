# Release publication uses the same lint/test/build gates as pull requests.
name: release
on:
  push:
    tags: ["v*"]
permissions:
  contents: read
concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false
jobs:
  checks:
    uses: ./.github/workflows/ci.yml
  publish:
    needs: checks
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: write
    env:
      GOWORK: "off"
      GOFLAGS: "-mod=readonly"
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-go@40f1582b2485089dde7abd97c1529aa768e1baff # v5
        with:
          go-version-file: go.mod
      - name: Build validated release targets
        env:
          VERSION: ${{ github.ref_name }}
        run: |
          bash scripts/build-release.sh
          ./dist/saifety_linux_amd64 version > dist/VERSION.txt
          (cd dist && sha256sum saifety_* VERSION.txt > SHA256SUMS)
      - name: Publish release assets
        uses: softprops/action-gh-release@3bb12739c298aeb8a4eeaf626c5b8d85266b0e65 # v2
        with:
          files: dist/*
          fail_on_unmatched_files: true
