# Builds prebuilt sAIfety binaries on tag push and attaches them to the
# GitHub Release. These are pure-Go (CGO_ENABLED=0) "lite" binaries: no native
# dependencies, cross-compiled for every target, so users install with no Go
# toolchain via scripts/install.sh. The transformer build (-tags onnx) needs a
# C compiler and is a source build (see README).
name: release
on:
  push:
    tags: ["v*"]
permissions:
  contents: write
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: "1.26"
      - name: Build binaries
        env:
          CGO_ENABLED: "0"
        run: |
          mkdir -p dist
          VER="${GITHUB_REF_NAME}"
          LDFLAGS="-s -w -X github.com/saifety-org/sAIfety/internal/cli.Version=${VER}"
          for target in linux/amd64 linux/arm64 darwin/amd64 darwin/arm64; do
            os="${target%/*}"; arch="${target#*/}"
            out="dist/saifety_${os}_${arch}"
            GOOS="$os" GOARCH="$arch" go build -ldflags "$LDFLAGS" -o "$out" ./cmd/saifety
          done
          # Windows
          GOOS=windows GOARCH=amd64 go build -ldflags "$LDFLAGS" -o dist/saifety_windows_amd64.exe ./cmd/saifety
          ls -la dist
      - name: Publish release assets
        uses: softprops/action-gh-release@v2
        with:
          files: dist/*
